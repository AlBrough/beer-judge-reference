name: BeerJudgeReference
options:
  bundleIdPrefix: com.brewvault
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: "493V5V65YV"
    CODE_SIGN_STYLE: Automatic
targets:
  BeerJudgeReference:
    type: application
    platform: iOS
    sources:
      - path: BeerJudgeReference
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brewvault.beerjudge
        PRODUCT_NAME: BeerJudgeReference
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Beer Judge
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.reference
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets:
        - BeerJudgeReferenceTests
  BeerJudgeReferenceTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BeerJudgeReferenceTests
      - path: Resources/guidelines-manifest.json
        buildPhase: resources
      - path: Resources/bjcp-2021.json
        buildPhase: resources
      - path: Resources/ba-2026.json
        buildPhase: resources
    dependencies:
      - target: BeerJudgeReference
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.brewvault.beerjudge.tests
