name: Android Play Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Store-facing version, for example 1.0.0
        required: true
        default: '1.0.0'
        type: string
      version_code:
        description: Increasing Play version code. Leave blank to use the workflow run number.
        required: false
        type: string

permissions:
  contents: read

env:
  ANDROID_PACKAGE_ID: com.brewvault.beerjudge
  VERSION_NAME: ${{ inputs.version_name || '1.0.0' }}
  VERSION_CODE: ${{ inputs.version_code || github.run_number }}

jobs:
  release:
    name: Android to Google Play internal testing
    runs-on: ubuntu-latest
    environment: mobile-release
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate release configuration
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          : "${ANDROID_UPLOAD_KEYSTORE_BASE64:?Set ANDROID_UPLOAD_KEYSTORE_BASE64}"
          : "${ANDROID_UPLOAD_STORE_PASSWORD:?Set ANDROID_UPLOAD_STORE_PASSWORD}"
          : "${ANDROID_UPLOAD_KEY_ALIAS:?Set ANDROID_UPLOAD_KEY_ALIAS}"
          : "${ANDROID_UPLOAD_KEY_PASSWORD:?Set ANDROID_UPLOAD_KEY_PASSWORD}"
          : "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:?Set GOOGLE_PLAY_SERVICE_ACCOUNT_JSON}"
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || { echo 'version_code must be positive'; exit 1; }
      - name: Restore upload keystore
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/bjr-upload.p12"
      - name: Build signed Android App Bundle
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/bjr-upload.p12
          STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon bundleRelease \
            -PbjrKeystorePath="$KEYSTORE_PATH" \
            -PbjrKeystorePassword="$STORE_PASSWORD" \
            -PbjrKeyAlias="$KEY_ALIAS" \
            -PbjrKeyPassword="$KEY_PASSWORD" \
            -PversionCode="$VERSION_CODE" \
            -PversionName="$VERSION_NAME"
      - name: Upload to Google Play internal testing
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.ANDROID_PACKAGE_ID }}
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          releaseName: ${{ env.VERSION_NAME }} (${{ env.VERSION_CODE }})
          tracks: internal
          status: completed
      - name: Remove restored keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/bjr-upload.p12"
