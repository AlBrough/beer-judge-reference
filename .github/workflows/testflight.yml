name: iOS TestFlight Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Store-facing version, for example 1.0.0
        required: true
        default: "1.0.0"
        type: string

concurrency:
  group: ios-testflight-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  IOS_BUNDLE_ID: com.brewvault.beerjudge

jobs:
  testflight:
    runs-on: macos-26
    environment: mobile-release
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Validate release inputs
        env:
          APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
          APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          APPSTORE_CERTIFICATES_FILE_BASE64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          APPSTORE_CERTIFICATES_PASSWORD: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}
        run: |
          : "${APPLE_TEAM_ID:?Set APPLE_TEAM_ID}"
          : "${APPSTORE_ISSUER_ID:?Set APPSTORE_ISSUER_ID}"
          : "${APPSTORE_API_KEY_ID:?Set APPSTORE_API_KEY_ID}"
          : "${APPSTORE_API_PRIVATE_KEY:?Set APPSTORE_API_PRIVATE_KEY}"
          : "${APPSTORE_CERTIFICATES_FILE_BASE64:?Set APPSTORE_CERTIFICATES_FILE_BASE64}"
          : "${APPSTORE_CERTIFICATES_PASSWORD:?Set APPSTORE_CERTIFICATES_PASSWORD}"
      - name: Validate data and generate project
        run: |
          npm ci
          npm run data:validate
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate
      - name: Import Apple distribution certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}
      - name: Download App Store provisioning profile
        uses: apple-actions/download-provisioning-profiles@v6
        with:
          bundle-id: ${{ env.IOS_BUNDLE_ID }}
          profile-type: IOS_APP_STORE
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
      - name: Archive signed app
        run: |
          mkdir -p build/export
          sed "s/__APPLE_TEAM_ID__/${APPLE_TEAM_ID}/g" ExportOptions.plist > build/ExportOptions.plist
          set -o pipefail
          xcodebuild \
            -project BeerJudgeReference.xcodeproj \
            -scheme BeerJudgeReference \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/BeerJudgeReference.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE_SPECIFIER="AppStore $IOS_BUNDLE_ID" \
            MARKETING_VERSION="${{ inputs.version_name }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive | tee build/archive.log
          xcodebuild \
            -exportArchive \
            -archivePath build/BeerJudgeReference.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist \
            | tee build/export.log
          IPA_PATH=$(find build/export -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$IPA_PATH"
          mv "$IPA_PATH" build/export/BeerJudgeReference.ipa
      - uses: actions/upload-artifact@v7
        with:
          name: beer-judge-ios-${{ inputs.version_name }}-${{ github.run_number }}
          path: |
            build/export/BeerJudgeReference.ipa
            build/archive.log
            build/export.log
          if-no-files-found: error
          retention-days: 30
      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: build/export/BeerJudgeReference.ipa
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
          wait-for-processing: "false"

