plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android { namespace 'com.brewvault.bjr'; compileSdk 36
    defaultConfig {
        applicationId 'com.brewvault.bjr'
        minSdk 26
        targetSdk 36
        versionCode project.hasProperty('versionCode') ? Integer.parseInt(project.property('versionCode').toString()) : 1
        versionName project.hasProperty('versionName') ? project.property('versionName').toString() : '1.0.0'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_21; targetCompatibility JavaVersion.VERSION_21 }
    signingConfigs {
        release {
            def keystorePath = providers.gradleProperty('bjrKeystorePath').orNull
            if (keystorePath != null) {
                storeFile file(keystorePath)
                storePassword providers.gradleProperty('bjrKeystorePassword').get()
                keyAlias providers.gradleProperty('bjrKeyAlias').get()
                keyPassword providers.gradleProperty('bjrKeyPassword').get()
            }
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
}

kotlin { jvmToolchain(21) }

dependencies {
    implementation platform('androidx.compose:compose-bom:2025.09.00')
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.2'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
